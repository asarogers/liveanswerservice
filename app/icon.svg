<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Live Answer mark: burgundy speech bubble + waveform + phone handset -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E2138"/>
      <stop offset="1" stop-color="#5A1424"/>
    </linearGradient>
  </defs>
  <!-- Rounded-square background (app-icon shape) -->
  <rect x="2" y="2" width="44" height="44" rx="9" fill="url(#bg)"/>
  <!-- Speech-bubble tail -->
  <path d="M 13 36 L 11 42 L 17 39 Z" fill="url(#bg)"/>
  <!-- Heartbeat / waveform -->
  <path d="M 9 24 L 14 24 L 16 18 L 19 30 L 22 14 L 25 30 L 28 22 L 31 24 L 36 24"
        stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Phone handset (lower right, cream/white) -->
  <path d="M 33 27 c 1.5 0 2.6 1.1 2.6 2.6 c 0 0.9 -0.4 1.6 -0.9 2 l -1.8 1.2 c 0.9 1.5 2.4 3 3.9 3.9 l 1.2 -1.8 c 0.4 -0.5 1.1 -0.9 2 -0.9 c 1.5 0 2.6 1.1 2.6 2.6 c 0 4.5 -5 6 -7.5 4.5 c -3.4 -2 -7.5 -6.1 -9.5 -9.5 c -1.5 -2.5 0 -7.5 4.5 -7.5 c 0.5 0 1 0 1.4 0.1"
        fill="#F5EFE3"/>
</svg>
