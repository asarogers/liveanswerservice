  <rect x="240" y="364" width="110" height="6" rx="2" fill="#6B8F71" opacity="0.4"/>
  <rect x="248" y="374" width="90" height="6" rx="2" fill="#6B8F71" opacity="0.35"/>
  <rect x="244" y="384" width="100" height="5" rx="2" fill="#6B8F71" opacity="0.3"/>

