  <path d="M510 362 Q560 340 630 338 Q690 338 715 355" stroke="#E05820" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M500 370 Q555 350 628 348 Q688 348 716 364" stroke="#E05820" stroke-width="1.5" fill="none" opacity="0.4"/>
