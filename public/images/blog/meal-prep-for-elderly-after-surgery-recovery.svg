  <circle cx="600" cy="155" r="55" fill="#6B8F71" opacity="0.12"/>
  <circle cx="600" cy="155" r="44" fill="#6B8F71" opacity="0.18"/>
  <rect x="586" y="120" width="28" height="70" rx="8" fill="#6B8F71" opacity="0.9"/>
  <rect x="570" y="136" width="60" height="28" rx="8" fill="#6B8F71" opacity="0.9"/>
  <rect x="588" y="122" width="24" height="66" rx="6" fill="#FAF7F2" opacity="0.25"/>

