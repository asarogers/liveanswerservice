  <path d="M470 365 Q530 330 620 328 Q700 328 730 350 Q720 375 680 382 Q610 390 520 382 Q480 375 470 365 Z" fill="#E87840"/>
  <path d="M480 362 Q540 332 620 330 Q695 330 722 350 Q712 372 675 379 Q608 387 522 380 Q484 372 480 362 Z" fill="#F09060" opacity="0.7"/>
