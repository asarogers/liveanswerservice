  <g transform="translate(745, 450)">
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#6B8F71" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="-14" cy="-26" rx="13" ry="7" fill="#6B8F71" opacity="0.6" transform="rotate(-35 -14 -26)"/>
    <ellipse cx="14" cy="-44" rx="12" ry="7" fill="#6B8F71" opacity="0.6" transform="rotate(30 14 -44)"/>
    <ellipse cx="-10" cy="-60" rx="11" ry="6" fill="#6B8F71" opacity="0.55" transform="rotate(-20 -10 -60)"/>
  </g>

  <!-- ── SPARKLE ACCENTS ── -->
  <circle cx="430" cy="220" r="7" fill="#C4622D" opacity="0.5"/>
  <circle cx="452" cy="238" r="4.5" fill="#C4622D" opacity="0.35"/>
  <circle cx="800" cy="280" r="6" fill="#6B8F71" opacity="0.4"/>
  <circle cx="1060" cy="390" r="5" fill="#C4622D" opacity="0.4"/>

  <!-- Bottom accent line -->
  <rect x="430" y="505" width="340" height="3" rx="1.5" fill="#6B8F71" opacity="0.25"/>
