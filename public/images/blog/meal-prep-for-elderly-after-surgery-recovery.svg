  <rect x="852" y="365" width="102" height="38" rx="5" fill="#C4622D" opacity="0.15"/>
  <text x="903" y="380" text-anchor="middle" fill="#C4622D" font-size="10" font-family="system-ui, sans-serif" font-weight="700">BONE</text>
  <text x="903" y="394" text-anchor="middle" fill="#C4622D" font-size="10" font-family="system-ui, sans-serif" font-weight="700">BROTH</text>

