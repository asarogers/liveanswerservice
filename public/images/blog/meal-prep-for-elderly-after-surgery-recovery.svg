  <path d="M903 295 Q896 272 904 252 Q912 232 904 212" stroke="#E0D8CF" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.65"/>
  <path d="M931 300 Q938 278 930 258" stroke="#E0D8CF" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.65"/>
