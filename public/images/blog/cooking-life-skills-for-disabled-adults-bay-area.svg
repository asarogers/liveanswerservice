<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="560" fill="#FAF7F2"/>
  <circle cx="140" cy="300" r="270" fill="#E8F0E9" opacity="0.5"/>
  <circle cx="1070" cy="240" r="220" fill="#E8F0E9" opacity="0.4"/>

  <!-- ── KITCHEN COUNTER (accessible height) ── -->
  <rect x="150" y="340" width="900" height="30" rx="6" fill="#D0C0A8"/>
  <rect x="150" y="335" width="900" height="10" rx="4" fill="#C4B098"/>
  <!-- Counter top surface -->
  <rect x="150" y="325" width="900" height="16" rx="5" fill="#E0D0B8"/>
  <!-- Cabinet below (accessible, open shelves) -->
  <rect x="150" y="370" width="900" height="130" rx="6" fill="#D8C8B0"/>
  <!-- Open shelf cutout (reachable from wheelchair) -->
  <rect x="200" y="382" width="180" height="110" rx="5" fill="#EAD8C0"/>
  <rect x="420" y="382" width="180" height="110" rx="5" fill="#EAD8C0"/>
  <rect x="640" y="382" width="180" height="110" rx="5" fill="#EAD8C0"/>
  <!-- Items on open shelves (low, reachable) -->
  <rect x="222" y="415" width="55" height="65" rx="6" fill="#6B8F71" opacity="0.8"/>
  <rect x="285" y="425" width="45" height="55" rx="5" fill="#C4622D" opacity="0.7"/>
  <rect x="456" y="410" width="50" height="70" rx="6" fill="#6B8F71" opacity="0.6"/>
  <rect x="515" y="418" width="55" height="62" rx="6" fill="#D4A848" opacity="0.65"/>
  <rect x="670" y="420" width="60" height="60" rx="8" fill="#E8F0E9" opacity="0.9"/>

  <!-- ── WHEELCHAIR (left, at counter) ── -->
  <!-- Main seat -->
  <rect x="248" y="240" width="120" height="75" rx="8" fill="#6B8F71"/>
  <rect x="252" y="244" width="112" height="67" rx="6" fill="#5A7F65"/>
  <!-- Backrest -->
  <rect x="358" y="160" width="18" height="90" rx="8" fill="#6B8F71"/>
  <rect x="240" y="160" width="18" height="90" rx="8" fill="#6B8F71"/>
  <!-- Backrest top bar -->
  <rect x="240" y="155" width="136" height="14" rx="7" fill="#4A6B50"/>
  <!-- Seat cushion -->
  <rect x="252" y="244" width="112" height="20" rx="5" fill="#8BAF90"/>
  <!-- Armrests -->
  <rect x="240" y="232" width="120" height="14" rx="6" fill="#4A6B50"/>
  <!-- Large rear wheels -->
  <circle cx="270" cy="360" r="62" fill="none" stroke="#2C2C2C" stroke-width="10"/>
  <circle cx="270" cy="360" r="52" fill="none" stroke="#3A3A3A" stroke-width="3"/>
  <!-- Spokes -->
  <line x1="270" y1="298" x2="270" y2="422" stroke="#2C2C2C" stroke-width="3"/>
  <line x1="208" y1="360" x2="332" y2="360" stroke="#2C2C2C" stroke-width="3"/>
  <line x1="226" y1="316" x2="314" y2="404" stroke="#2C2C2C" stroke-width="3"/>
  <line x1="314" y1="316" x2="226" y2="404" stroke="#2C2C2C" stroke-width="3"/>
  <circle cx="270" cy="360" r="12" fill="#3A3A3A"/>
  <!-- Right rear wheel -->
  <circle cx="360" cy="360" r="62" fill="none" stroke="#2C2C2C" stroke-width="10"/>
  <circle cx="360" cy="360" r="52" fill="none" stroke="#3A3A3A" stroke-width="3"/>
  <line x1="360" y1="298" x2="360" y2="422" stroke="#2C2C2C" stroke-width="3"/>
  <line x1="298" y1="360" x2="422" y2="360" stroke="#2C2C2C" stroke-width="3"/>
  <line x1="316" y1="316" x2="404" y2="404" stroke="#2C2C2C" stroke-width="3"/>
  <line x1="404" y1="316" x2="316" y2="404" stroke="#2C2C2C" stroke-width="3"/>
  <circle cx="360" cy="360" r="12" fill="#3A3A3A"/>
  <!-- Small front casters -->
  <circle cx="248" cy="318" r="16" fill="#2C2C2C"/>
  <circle cx="368" cy="318" r="16" fill="#2C2C2C"/>
  <!-- Footrests -->
  <rect x="238" y="310" width="24" height="55" rx="5" fill="#4A4A4A"/>
  <rect x="354" y="310" width="24" height="55" rx="5" fill="#4A4A4A"/>
  <rect x="225" y="360" width="50" height="12" rx="5" fill="#3A3A3A"/>
  <rect x="341" y="360" width="50" height="12" rx="5" fill="#3A3A3A"/>

  <!-- ── PERSON (simple, seated in wheelchair) ── -->
  <!-- Head -->
  <circle cx="310" cy="210" r="32" fill="#D8C0A0"/>
  <!-- Hair -->
  <path d="M282 198 Q310 178 338 198 Q338 184 310 180 Q282 184 282 198 Z" fill="#4A3020" opacity="0.8"/>
  <!-- Body (in chair) -->
  <rect x="278" y="242" width="64" height="62" rx="8" fill="#C4622D" opacity="0.85"/>
  <!-- Arms reaching forward to counter -->
  <path d="M342 258 Q400 248 460 255" stroke="#D8C0A0" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M278 258 Q240 252 220 260" stroke="#D8C0A0" stroke-width="16" fill="none" stroke-linecap="round"/>

  <!-- ── CUTTING BOARD on counter (at accessible height) ── -->
  <rect x="460" y="270" width="220" height="55" rx="8" fill="#D4A848" opacity="0.8"/>
  <rect x="465" y="274" width="210" height="46" rx="6" fill="#E0B860" opacity="0.6"/>
  <!-- Vegetables being chopped -->
  <!-- Carrot slices -->
  <ellipse cx="510" cy="297" rx="16" ry="11" fill="#E87830" opacity="0.9"/>
  <ellipse cx="540" cy="295" rx="16" ry="11" fill="#E87830" opacity="0.85"/>
  <ellipse cx="570" cy="298" rx="16" ry="11" fill="#E87830" opacity="0.9"/>
  <!-- Rocker knife on board -->
  <path d="M620 278 Q680 268 710 280 Q700 298 620 305 Z" fill="#9A9A9A"/>
  <path d="M625 282 Q675 274 704 284 Q695 296 625 300 Z" fill="#C8C8C8" opacity="0.7"/>
  <!-- Handle -->
  <path d="M618 278 Q608 270 600 282 Q596 294 610 300 Q618 302 622 298" fill="#6B8F71"/>

  <!-- ── INDEPENDENCE STAR BADGE (top right) ── -->
  <circle cx="940" cy="160" r="60" fill="#6B8F71" opacity="0.12"/>
  <circle cx="940" cy="160" r="48" fill="#6B8F71" opacity="0.85"/>
  <!-- Star -->
  <path d="M940 124 L950 148 L976 148 L956 164 L964 188 L940 174 L916 188 L924 164 L904 148 L930 148 Z" fill="#FAF7F2" opacity="0.9"/>

  <!-- ── SPARKLE ACCENTS ── -->
  <circle cx="760" cy="230" r="7" fill="#C4622D" opacity="0.5"/>
  <circle cx="780" cy="248" r="4.5" fill="#C4622D" opacity="0.35"/>
  <circle cx="1060" cy="380" r="6" fill="#6B8F71" opacity="0.4"/>
  <circle cx="140" cy="180" r="5" fill="#C4622D" opacity="0.4"/>

  <!-- Bottom accent line -->
  <rect x="430" y="505" width="340" height="3" rx="1.5" fill="#6B8F71" opacity="0.25"/>
</svg>
