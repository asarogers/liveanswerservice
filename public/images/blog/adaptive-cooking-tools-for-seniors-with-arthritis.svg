<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="560" fill="#FAF7F2"/>
  <!-- Soft background shapes -->
  <circle cx="120" cy="280" r="280" fill="#E8F0E9" opacity="0.55"/>
  <circle cx="1080" cy="200" r="220" fill="#E8F0E9" opacity="0.4"/>
  <circle cx="920" cy="500" r="160" fill="#E0D8CF" opacity="0.35"/>

  <!-- ── ERGONOMIC KNIFE (center) ── -->
  <!-- Blade -->
  <path d="M560 240 Q680 225 760 268 Q700 288 560 295 Z" fill="#A0A0A0"/>
  <path d="M565 248 Q670 236 745 266 Q685 278 565 283 Z" fill="#D0D0D0" opacity="0.7"/>
  <!-- Bolster -->
  <rect x="542" y="232" width="22" height="68" rx="5" fill="#3A3A3A"/>
  <!-- Handle body – thick ergonomic, sage green -->
  <path d="M370 228 Q460 218 542 232 L542 300 Q460 314 370 304 Q320 296 318 266 Q318 236 370 228 Z" fill="#6B8F71"/>
  <!-- Handle grip grooves -->
  <line x1="415" y1="222" x2="415" y2="308" stroke="#4A6B50" stroke-width="3" opacity="0.35" stroke-linecap="round"/>
  <line x1="453" y1="220" x2="453" y2="310" stroke="#4A6B50" stroke-width="3" opacity="0.35" stroke-linecap="round"/>
  <line x1="491" y1="219" x2="491" y2="311" stroke="#4A6B50" stroke-width="3" opacity="0.35" stroke-linecap="round"/>
  <!-- End cap -->
  <ellipse cx="332" cy="266" rx="28" ry="38" fill="#4A6B50"/>

  <!-- ── JAR OPENER DEVICE (left) ── -->
  <!-- Jar body -->
  <rect x="145" y="315" width="150" height="155" rx="14" fill="#D8D0C8"/>
  <rect x="158" y="328" width="124" height="130" rx="10" fill="#EFF5F0" opacity="0.7"/>
  <!-- Jar contents - light green blobs -->
  <ellipse cx="220" cy="400" rx="45" ry="35" fill="#B5D4BB" opacity="0.6"/>
  <!-- Jar lid -->
  <rect x="130" y="278" width="180" height="44" rx="10" fill="#C4622D"/>
  <rect x="126" y="270" width="188" height="16" rx="8" fill="#A34F23"/>
  <rect x="126" y="314" width="188" height="10" rx="5" fill="#A34F23"/>
  <!-- Electric opener wrapped around lid -->
  <path d="M316 290 Q355 282 360 300 Q355 316 316 308 Z" fill="#6B8F71"/>
  <circle cx="358" cy="299" r="16" fill="#4A6B50"/>
  <circle cx="358" cy="299" r="9" fill="#FAF7F2" opacity="0.5"/>
  <!-- Power arrow -->
  <path d="M353 299 L365 299 M360 294 L366 300 L360 306" stroke="#FAF7F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- ── LOOP SCISSORS (right) ── -->
  <g transform="translate(880, 260) rotate(-15)">
    <!-- Blade 1 -->
    <path d="M0 10 Q70 0 130 25 Q70 35 0 30 Z" fill="#9A9A9A"/>
    <!-- Blade 2 -->
    <path d="M0 50 Q70 35 130 25 Q70 45 0 70 Z" fill="#7A7A7A"/>
    <!-- Pivot screw -->
    <circle cx="0" cy="40" r="13" fill="#3A3A3A"/>
    <circle cx="0" cy="40" r="5" fill="#5A5A5A"/>
    <!-- Loop handles (spring-loaded, no squeeze needed) -->
    <path d="M-10 27 Q-70 10 -85 40 Q-70 70 -10 53" stroke="#6B8F71" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- Spring coil accent -->
    <path d="M-13 38 Q-5 32 -13 46" stroke="#C4622D" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Arrow indicating spring-open -->
    <path d="M-80 20 Q-100 40 -80 58" stroke="#C4622D" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="4,3"/>
    <path d="M-76 55 L-80 58 L-84 54" stroke="#C4622D" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ── HERB SPRIGS ── -->
  <g transform="translate(670, 430)">
    <line x1="0" y1="0" x2="0" y2="-90" stroke="#6B8F71" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="-16" cy="-28" rx="14" ry="8" fill="#6B8F71" opacity="0.65" transform="rotate(-35 -16 -28)"/>
    <ellipse cx="16" cy="-45" rx="14" ry="8" fill="#6B8F71" opacity="0.65" transform="rotate(35 16 -45)"/>
    <ellipse cx="-12" cy="-62" rx="12" ry="7" fill="#6B8F71" opacity="0.65" transform="rotate(-25 -12 -62)"/>
    <ellipse cx="12" cy="-76" rx="10" ry="6" fill="#6B8F71" opacity="0.6" transform="rotate(25 12 -76)"/>
  </g>
  <g transform="translate(480, 450)">
    <line x1="0" y1="0" x2="-15" y2="-65" stroke="#6B8F71" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="-18" cy="-22" rx="11" ry="6" fill="#6B8F71" opacity="0.45" transform="rotate(-40 -18 -22)"/>
    <ellipse cx="-22" cy="-48" rx="10" ry="6" fill="#6B8F71" opacity="0.45" transform="rotate(-20 -22 -48)"/>
  </g>

  <!-- ── SPARKLE ACCENTS ── -->
  <circle cx="820" cy="190" r="7" fill="#C4622D" opacity="0.65"/>
  <circle cx="840" cy="213" r="4.5" fill="#C4622D" opacity="0.45"/>
  <circle cx="280" cy="228" r="5" fill="#C4622D" opacity="0.55"/>
  <circle cx="760" cy="380" r="5" fill="#6B8F71" opacity="0.4"/>

  <!-- ── BOTTOM ACCENT LINE ── -->
  <rect x="430" y="500" width="340" height="3" rx="1.5" fill="#6B8F71" opacity="0.25"/>
</svg>
