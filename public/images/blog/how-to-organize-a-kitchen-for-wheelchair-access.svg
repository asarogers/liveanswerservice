  <rect x="515" y="372" width="18" height="8" rx="4" fill="#9A9A9A"/>

  <!-- Cabinet 3 (accessible, pull-out drawers) -->
  <rect x="580" y="318" width="175" height="122" rx="6" fill="#D8E8DA"/>
  <rect x="588" y="326" width="159" height="34" rx="4" fill="#E0F0E2"/>
  <rect x="588" y="368" width="159" height="34" rx="4" fill="#E0F0E2"/>
  <rect x="588" y="410" width="159" height="22" rx="4" fill="#E0F0E2"/>
  <!-- Drawer handles (D-ring, easier to grip) -->
  <path d="M658 340 Q668 336 678 340" stroke="#6B8F71" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M658 384 Q668 380 678 384" stroke="#6B8F71" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Green label: ACCESSIBLE -->
  <rect x="595" y="419" width="145" height="6" rx="3" fill="#6B8F71" opacity="0.4"/>

