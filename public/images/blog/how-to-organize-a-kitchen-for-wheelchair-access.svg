  <path d="M1062 333 Q1082 340 1090 352 Q1095 360 1088 364 Q1082 356 1070 348 L1058 340 Z" fill="#D4A882"/>
  <!-- Lap -->
  <path d="M1020 370 L1058 370 L1055 390 L1023 390 Z" fill="#5A5A5A"/>
  <!-- Large wheel (back) -->
  <circle cx="1020" cy="410" r="52" fill="none" stroke="#3A3A3A" stroke-width="6"/>
  <circle cx="1020" cy="410" r="10" fill="#3A3A3A"/>
  <line x1="1020" y1="358" x2="1020" y2="462" stroke="#5A5A5A" stroke-width="3" opacity="0.6"/>
  <line x1="968" y1="410" x2="1072" y2="410" stroke="#5A5A5A" stroke-width="3" opacity="0.6"/>
  <line x1="983" y1="373" x2="1057" y2="447" stroke="#5A5A5A" stroke-width="3" opacity="0.6"/>
  <line x1="983" y1="447" x2="1057" y2="373" stroke="#5A5A5A" stroke-width="3" opacity="0.6"/>
  <!-- Small front wheel -->
  <circle cx="1072" cy="432" r="18" fill="none" stroke="#3A3A3A" stroke-width="5"/>
  <circle cx="1072" cy="432" r="5" fill="#3A3A3A"/>
  <!-- Footrests -->
  <rect x="1050" y="395" width="40" height="8" rx="4" fill="#3A3A3A"/>
  <!-- Reaching toward counter -->
  <path d="M1088 352 Q1100 340 1110 338 Q1108 345 1100 348 Z" fill="#D4A882"/>

  <!-- ── ITEMS AT ACCESSIBLE HEIGHT (on counter) ── -->
  <!-- Cutting board -->
  <rect x="420" y="268" width="120" height="28" rx="5" fill="#C4A882"/>
  <!-- Mug -->
  <rect x="560" y="262" width="38" height="35" rx="5" fill="#6B8F71"/>
  <path d="M598 272 Q614 270 614 282 Q614 294 598 292" stroke="#6B8F71" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Small appliance -->
  <rect x="620" y="257" width="70" height="40" rx="6" fill="#D8D0C8"/>
  <circle cx="670" cy="270" r="7" fill="#C4622D" opacity="0.8"/>

  <!-- ── SPARKLE & DECORATION ── -->
  <circle cx="350" cy="80" r="7" fill="#C4622D" opacity="0.45"/>
  <circle cx="370" cy="98" r="4.5" fill="#C4622D" opacity="0.3"/>
  <circle cx="760" cy="80" r="6" fill="#6B8F71" opacity="0.4"/>
  <rect x="460" y="508" width="280" height="3" rx="1.5" fill="#6B8F71" opacity="0.2"/>
</svg>
