  <rect x="820" y="120" width="165" height="155" rx="6" fill="#E0D8D0"/>
  <rect x="828" y="128" width="71" height="139" rx="4" fill="#EEE6DE"/>
  <rect x="907" y="128" width="70" height="139" rx="4" fill="#EEE6DE"/>
  <rect x="854" y="190" width="18" height="8" rx="4" fill="#9A9A9A"/>
  <rect x="933" y="190" width="18" height="8" rx="4" fill="#9A9A9A"/>
