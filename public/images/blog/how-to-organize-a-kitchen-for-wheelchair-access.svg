  <line x1="165" y1="270" x2="185" y2="270" stroke="#6B8F71" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="410" x2="185" y2="410" stroke="#6B8F71" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="270" x2="165" y2="410" stroke="#6B8F71" stroke-width="3" stroke-linecap="round"/>
