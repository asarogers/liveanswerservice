  <rect x="765" y="318" width="175" height="122" rx="6" fill="#E8E0D8"/>
  <rect x="773" y="326" width="75" height="106" rx="4" fill="#F0E8E0"/>
  <rect x="856" y="326" width="76" height="106" rx="4" fill="#F0E8E0"/>
  <rect x="801" y="372" width="18" height="8" rx="4" fill="#9A9A9A"/>
  <rect x="885" y="372" width="18" height="8" rx="4" fill="#9A9A9A"/>

