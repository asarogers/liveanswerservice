  <text x="152" y="348" text-anchor="middle" fill="#6B8F71" font-size="11" font-family="system-ui, sans-serif" font-weight="700" transform="rotate(-90 152 348)">EASY REACH ZONE</text>

  <!-- Out of reach indicator -->
  <line x1="165" y1="120" x2="165" y2="268" stroke="#C4622D" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5,4" opacity="0.6"/>
  <text x="152" y="198" text-anchor="middle" fill="#C4622D" font-size="10" font-family="system-ui, sans-serif" font-weight="600" transform="rotate(-90 152 198)" opacity="0.8">TOO HIGH</text>

  <!-- ── WHEELCHAIR FIGURE (right side) ── -->
  <!-- Person head -->
  <circle cx="1040" cy="295" r="28" fill="#D4A882"/>
  <!-- Torso -->
  <path d="M1018 323 Q1020 295 1040 292 Q1060 295 1062 323 L1058 370 L1022 370 Z" fill="#6B8F71"/>
  <!-- Arms -->
