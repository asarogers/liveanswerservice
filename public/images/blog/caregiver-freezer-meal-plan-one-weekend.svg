<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="560" fill="#FAF7F2"/>
  <circle cx="140" cy="290" r="265" fill="#E8F0E9" opacity="0.5"/>
  <circle cx="1060" cy="230" r="220" fill="#E8F0E9" opacity="0.4"/>

  <!-- ── FREEZER UNIT (center) ── -->
  <!-- Freezer body -->
  <rect x="410" y="165" width="380" height="330" rx="16" fill="#D0C8C0"/>
  <rect x="416" y="171" width="368" height="318" rx="12" fill="#E8E0D8"/>
  <!-- Freezer door seam -->
  <line x1="410" y1="332" x2="790" y2="332" stroke="#C0B8B0" stroke-width="3"/>
  <!-- Freezer door handles -->
  <rect x="438" y="245" width="16" height="70" rx="7" fill="#9A9090"/>
  <rect x="438" y="355" width="16" height="70" rx="7" fill="#9A9090"/>
  <!-- Inside upper (fridge section) -->
  <rect x="424" y="180" width="352" height="140" rx="8" fill="#EFF5F0"/>
  <!-- Inside lower (freezer section) -->
  <rect x="424" y="340" width="352" height="138" rx="8" fill="#DDE8F5"/>
  <!-- FROZEN label -->
  <text x="600" y="365" text-anchor="middle" fill="#6080A0" font-size="13" font-family="system-ui, sans-serif" font-weight="700" opacity="0.6">FREEZER</text>

  <!-- ── CONTAINERS in fridge section ── -->
  <!-- Row 1 -->
  <rect x="436" y="192" width="95" height="52" rx="7" fill="#D0C8C0"/>
  <rect x="440" y="196" width="87" height="44" rx="5" fill="#EFF5F0"/>
  <ellipse cx="483" cy="216" rx="28" ry="12" fill="#C4622D" opacity="0.5"/>
  <rect x="436" y="186" width="95" height="12" rx="4" fill="#4A4A4A"/>

  <rect x="541" y="192" width="95" height="52" rx="7" fill="#D0C8C0"/>
  <rect x="545" y="196" width="87" height="44" rx="5" fill="#EFF5F0"/>
  <ellipse cx="588" cy="216" rx="28" ry="12" fill="#6B8F71" opacity="0.55"/>
  <rect x="541" y="186" width="95" height="12" rx="4" fill="#4A4A4A"/>

  <rect x="646" y="192" width="95" height="52" rx="7" fill="#D0C8C0"/>
  <rect x="650" y="196" width="87" height="44" rx="5" fill="#EFF5F0"/>
  <ellipse cx="693" cy="216" rx="28" ry="12" fill="#E8A030" opacity="0.6"/>
  <rect x="646" y="186" width="95" height="12" rx="4" fill="#4A4A4A"/>

  <!-- Row 2 (soup containers) -->
  <rect x="436" y="255" width="136" height="50" rx="7" fill="#C8C0B8"/>
  <rect x="440" y="259" width="128" height="42" rx="5" fill="#EFF5F0"/>
  <ellipse cx="504" cy="278" rx="42" ry="13" fill="#C4622D" opacity="0.45"/>
  <rect x="436" y="249" width="136" height="12" rx="4" fill="#3A3A3A"/>

  <rect x="582" y="255" width="136" height="50" rx="7" fill="#C8C0B8"/>
  <rect x="586" y="259" width="128" height="42" rx="5" fill="#EFF5F0"/>
  <ellipse cx="650" cy="278" rx="42" ry="13" fill="#6B8F71" opacity="0.45"/>
  <rect x="582" y="249" width="136" height="12" rx="4" fill="#3A3A3A"/>

  <!-- ── FREEZER BAGS in freezer section ── -->
  <!-- Bag 1 -->
  <rect x="436" y="378" width="80" height="88" rx="6" fill="#B8D0E8" opacity="0.85"/>
  <rect x="440" y="385" width="72" height="75" rx="4" fill="#C8DDF0" opacity="0.7"/>
  <!-- Frozen fruit contents -->
  <circle cx="460" cy="408" r="8" fill="#8040C0" opacity="0.7"/>
  <circle cx="475" cy="415" r="7" fill="#C04060" opacity="0.7"/>
  <circle cx="490" cy="405" r="8" fill="#8040C0" opacity="0.65"/>
  <circle cx="468" cy="425" r="7" fill="#C04060" opacity="0.65"/>
  <!-- Snowflake on bag -->
  <g transform="translate(476, 448)" opacity="0.6">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#6080A0" stroke-width="2"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#6080A0" stroke-width="2"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#6080A0" stroke-width="2"/>
    <line x1="7" y1="-7" x2="-7" y2="7" stroke="#6080A0" stroke-width="2"/>
  </g>
  <!-- Bag 2 -->
  <rect x="526" y="378" width="80" height="88" rx="6" fill="#B8D0E8" opacity="0.85"/>
  <rect x="530" y="385" width="72" height="75" rx="4" fill="#C8DDF0" opacity="0.7"/>
  <!-- Frozen spinach -->
  <ellipse cx="556" cy="415" rx="20" ry="14" fill="#4A6B50" opacity="0.7"/>
  <ellipse cx="572" cy="422" rx="16" ry="12" fill="#6B8F71" opacity="0.65"/>
  <g transform="translate(566, 448)" opacity="0.6">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#6080A0" stroke-width="2"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#6080A0" stroke-width="2"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#6080A0" stroke-width="2"/>
    <line x1="7" y1="-7" x2="-7" y2="7" stroke="#6080A0" stroke-width="2"/>
  </g>
  <!-- Bag 3 -->
  <rect x="616" y="378" width="80" height="88" rx="6" fill="#B8D0E8" opacity="0.85"/>
  <rect x="620" y="385" width="72" height="75" rx="4" fill="#C8DDF0" opacity="0.7"/>
