  <ellipse cx="650" cy="412" rx="24" ry="16" fill="#E8A030" opacity="0.7"/>
  <ellipse cx="660" cy="424" rx="18" ry="12" fill="#D89028" opacity="0.6"/>
  <g transform="translate(656, 448)" opacity="0.6">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#6080A0" stroke-width="2"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#6080A0" stroke-width="2"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#6080A0" stroke-width="2"/>
    <line x1="7" y1="-7" x2="-7" y2="7" stroke="#6080A0" stroke-width="2"/>
  </g>
  <!-- Bag 4 -->
  <rect x="706" y="378" width="80" height="88" rx="6" fill="#B8D0E8" opacity="0.85"/>
  <rect x="710" y="385" width="72" height="75" rx="4" fill="#C8DDF0" opacity="0.7"/>
  <ellipse cx="746" cy="412" rx="24" ry="16" fill="#C4622D" opacity="0.6"/>
  <ellipse cx="740" cy="424" rx="18" ry="12" fill="#D47240" opacity="0.55"/>
  <g transform="translate(746, 448)" opacity="0.6">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#6080A0" stroke-width="2"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#6080A0" stroke-width="2"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#6080A0" stroke-width="2"/>
    <line x1="7" y1="-7" x2="-7" y2="7" stroke="#6080A0" stroke-width="2"/>
  </g>

  <!-- ── LARGE SNOWFLAKE (left, accent) ── -->
  <g transform="translate(240, 310)" opacity="0.25">
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#6080A0" stroke-width="8" stroke-linecap="round"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#6080A0" stroke-width="8" stroke-linecap="round"/>
    <line x1="-57" y1="-57" x2="57" y2="57" stroke="#6080A0" stroke-width="8" stroke-linecap="round"/>
    <line x1="57" y1="-57" x2="-57" y2="57" stroke="#6080A0" stroke-width="8" stroke-linecap="round"/>
