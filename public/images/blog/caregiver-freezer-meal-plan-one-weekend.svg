    <line x1="-20" y1="-60" x2="0" y2="-80" stroke="#6080A0" stroke-width="5" stroke-linecap="round"/>
    <line x1="20" y1="-60" x2="0" y2="-80" stroke="#6080A0" stroke-width="5" stroke-linecap="round"/>
    <line x1="60" y1="-20" x2="80" y2="0" stroke="#6080A0" stroke-width="5" stroke-linecap="round"/>
    <line x1="60" y1="20" x2="80" y2="0" stroke="#6080A0" stroke-width="5" stroke-linecap="round"/>
