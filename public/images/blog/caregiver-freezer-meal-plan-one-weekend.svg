  <!-- ── CALENDAR (top right) — weekend plan ── -->
  <rect x="880" y="160" width="175" height="155" rx="12" fill="#E0D8CF"/>
  <rect x="880" y="160" width="175" height="46" rx="12" fill="#6B8F71"/>
  <rect x="880" y="190" width="175" height="16" fill="#6B8F71"/>
  <text x="968" y="186" text-anchor="middle" fill="#FAF7F2" font-size="12" font-family="system-ui, sans-serif" font-weight="700">ONE WEEKEND</text>
  <!-- Binding tabs -->
  <rect x="912" y="150" width="12" height="22" rx="6" fill="#4A6B50"/>
  <rect x="1006" y="150" width="12" height="22" rx="6" fill="#4A6B50"/>
  <!-- SAT highlighted -->
  <rect x="896" y="216" width="60" height="56" rx="8" fill="#C4622D" opacity="0.9"/>
  <text x="926" y="240" text-anchor="middle" fill="#FAF7F2" font-size="11" font-family="system-ui, sans-serif" font-weight="700">SAT</text>
  <text x="926" y="258" text-anchor="middle" fill="#FAF7F2" font-size="11" font-family="system-ui, sans-serif" font-weight="600">PREP</text>
  <!-- SUN highlighted -->
  <rect x="966" y="216" width="60" height="56" rx="8" fill="#C4622D" opacity="0.9"/>
  <text x="996" y="240" text-anchor="middle" fill="#FAF7F2" font-size="11" font-family="system-ui, sans-serif" font-weight="700">SUN</text>
  <text x="996" y="258" text-anchor="middle" fill="#FAF7F2" font-size="11" font-family="system-ui, sans-serif" font-weight="600">FINISH</text>
  <!-- Week indicator line -->
  <rect x="896" y="285" width="130" height="22" rx="6" fill="#FAF7F2" opacity="0.6"/>
  <text x="961" y="300" text-anchor="middle" fill="#5A5A5A" font-size="10" font-family="system-ui, sans-serif" font-weight="600">4 WEEKS OF FOOD</text>

  <!-- ── SPARKLE ACCENTS ── -->
  <circle cx="382" cy="205" r="7" fill="#6080A0" opacity="0.4"/>
  <circle cx="402" cy="222" r="4.5" fill="#6080A0" opacity="0.3"/>
  <circle cx="1060" cy="410" r="6" fill="#C4622D" opacity="0.4"/>
  <circle cx="350" cy="450" r="5" fill="#6B8F71" opacity="0.4"/>

  <!-- Bottom accent line -->
  <rect x="430" y="505" width="340" height="3" rx="1.5" fill="#6B8F71" opacity="0.25"/>
</svg>
