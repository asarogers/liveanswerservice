  <path d="M540 255 Q530 230 540 210 Q550 190 540 170" stroke="#E0D8CF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M600 250 Q590 222 600 200 Q610 178 600 158" stroke="#E0D8CF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M660 255 Q670 230 660 210 Q650 190 660 170" stroke="#E0D8CF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
