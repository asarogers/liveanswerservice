  <circle cx="910" cy="380" r="16" fill="#C4622D"/>
  <circle cx="910" cy="380" r="12" fill="#D4622D" opacity="0.8"/>
  <path d="M907 366 Q910 362 913 366" stroke="#6B8F71" stroke-width="2" fill="none"/>
  <circle cx="940" cy="395" r="14" fill="#C4622D" opacity="0.9"/>
  <!-- Bell pepper slices -->
  <ellipse cx="990" cy="375" rx="30" ry="18" fill="#C4622D" opacity="0.7" transform="rotate(-15 990 375)"/>
  <ellipse cx="990" cy="375" rx="24" ry="12" fill="#D87040" opacity="0.5" transform="rotate(-15 990 375)"/>
