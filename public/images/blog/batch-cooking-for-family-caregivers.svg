  <!-- Container 3 (back) -->
  <rect x="195" y="295" width="160" height="95" rx="10" fill="#D0C8C0"/>
  <rect x="200" y="300" width="150" height="85" rx="8" fill="#EFF5F0" opacity="0.9"/>
  <rect x="195" y="285" width="160" height="16" rx="6" fill="#4A4A4A"/>
  <!-- Container 2 -->
  <rect x="185" y="360" width="160" height="95" rx="10" fill="#C8C0B8"/>
  <rect x="190" y="365" width="150" height="85" rx="8" fill="#EFF5F0" opacity="0.9"/>
