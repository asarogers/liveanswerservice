  <rect x="920" y="130" width="130" height="120" rx="10" fill="#E0D8CF"/>
  <rect x="920" y="130" width="130" height="36" rx="10" fill="#6B8F71"/>
  <rect x="920" y="152" width="130" height="14" fill="#6B8F71"/>
  <!-- Calendar binding bars -->
  <rect x="948" y="122" width="10" height="20" rx="5" fill="#4A6B50"/>
  <rect x="1018" y="122" width="10" height="20" rx="5" fill="#4A6B50"/>
  <!-- Calendar days grid -->
  <rect x="932" y="180" width="16" height="16" rx="3" fill="#FAF7F2" opacity="0.8"/>
  <rect x="956" y="180" width="16" height="16" rx="3" fill="#FAF7F2" opacity="0.8"/>
  <rect x="980" y="180" width="16" height="16" rx="3" fill="#FAF7F2" opacity="0.8"/>
  <rect x="1004" y="180" width="16" height="16" rx="3" fill="#FAF7F2" opacity="0.8"/>
  <rect x="932" y="204" width="16" height="16" rx="3" fill="#FAF7F2" opacity="0.8"/>
  <!-- Checkmark on Sunday -->
  <rect x="956" y="204" width="16" height="16" rx="3" fill="#C4622D"/>
  <path d="M960 212 L964 216 L970 208" stroke="#FAF7F2" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="980" y="204" width="16" height="16" rx="3" fill="#FAF7F2" opacity="0.8"/>
  <rect x="1004" y="204" width="16" height="16" rx="3" fill="#FAF7F2" opacity="0.8"/>
