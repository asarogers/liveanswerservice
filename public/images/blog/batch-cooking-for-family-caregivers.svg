  <rect x="192" y="444" width="80" height="18" rx="3" fill="#FAF7F2"/>
  <rect x="196" y="448" width="50" height="4" rx="1.5" fill="#9A9A9A" opacity="0.6"/>
  <rect x="196" y="455" width="38" height="4" rx="1.5" fill="#9A9A9A" opacity="0.6"/>

