  <circle cx="850" cy="375" r="22" fill="#4A6B50"/>
  <circle cx="850" cy="362" r="14" fill="#6B8F71"/>
  <circle cx="840" cy="372" r="10" fill="#4A6B50"/>
  <circle cx="862" cy="370" r="10" fill="#5A7F60"/>
