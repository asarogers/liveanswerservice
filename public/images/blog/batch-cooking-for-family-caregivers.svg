  <text x="985" y="155" text-anchor="middle" fill="#FAF7F2" font-size="12" font-family="system-ui, sans-serif" font-weight="700">SUNDAY PREP</text>

  <!-- ── HERB SPRIG ── -->
  <g transform="translate(730, 440)">
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#6B8F71" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="-14" cy="-26" rx="12" ry="7" fill="#6B8F71" opacity="0.6" transform="rotate(-35 -14 -26)"/>
    <ellipse cx="14" cy="-42" rx="12" ry="7" fill="#6B8F71" opacity="0.6" transform="rotate(35 14 -42)"/>
    <ellipse cx="-10" cy="-58" rx="10" ry="6" fill="#6B8F71" opacity="0.55" transform="rotate(-20 -10 -58)"/>
  </g>

  <!-- ── SPARKLE ACCENTS ── -->
  <circle cx="420" cy="240" r="7" fill="#C4622D" opacity="0.5"/>
  <circle cx="442" cy="258" r="4.5" fill="#C4622D" opacity="0.35"/>
  <circle cx="780" cy="280" r="6" fill="#6B8F71" opacity="0.4"/>
  <circle cx="1080" cy="430" r="5" fill="#C4622D" opacity="0.4"/>

