  <ellipse cx="600" cy="420" rx="140" ry="22" fill="#2C2C2C" opacity="0.12"/>
  <rect x="465" y="270" width="270" height="155" rx="18" fill="#5A5A5A"/>
  <rect x="470" y="275" width="260" height="145" rx="15" fill="#6B6B6B"/>
