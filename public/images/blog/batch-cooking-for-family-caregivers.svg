  <rect x="178" y="425" width="160" height="95" rx="10" fill="#B8B0A8"/>
  <rect x="183" y="430" width="150" height="85" rx="8" fill="#EFF5F0" opacity="0.9"/>
  <!-- Protein inside -->
  <ellipse cx="248" cy="468" rx="35" ry="18" fill="#C4622D" opacity="0.45"/>
  <ellipse cx="290" cy="475" rx="22" ry="12" fill="#C4622D" opacity="0.35"/>
  <rect x="178" y="415" width="160" height="16" rx="6" fill="#2C2C2C"/>
