  <ellipse cx="870" cy="430" rx="22" ry="14" fill="#6B8F71" opacity="0.75"/>
  <ellipse cx="870" cy="430" rx="16" ry="9" fill="#8BAF90" opacity="0.6"/>
  <ellipse cx="916" cy="440" rx="22" ry="14" fill="#6B8F71" opacity="0.75"/>
  <ellipse cx="962" cy="435" rx="22" ry="14" fill="#6B8F71" opacity="0.7"/>
  <!-- Olive oil drizzle -->
  <path d="M1010 340 Q1040 360 1020 400" stroke="#D4A848" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>

