  <path d="M465 310 Q435 308 430 328 Q430 348 465 346" stroke="#4A4A4A" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M735 310 Q765 308 770 328 Q770 348 735 346" stroke="#4A4A4A" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Lid -->
  <ellipse cx="600" cy="272" rx="132" ry="19" fill="#4A4A4A"/>
  <ellipse cx="600" cy="265" rx="128" ry="16" fill="#5A5A5A"/>
