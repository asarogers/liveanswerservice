  <text x="475" y="265" text-anchor="middle" fill="#4A6B50" font-size="7" font-family="system-ui" font-weight="600">SUGAR</text>

  <!-- Labeled jar 3 (RICE) -->
  <rect x="515" y="228" width="48" height="76" rx="6" fill="#E8F0E9" stroke="#B5D4BB" stroke-width="1.5"/>
